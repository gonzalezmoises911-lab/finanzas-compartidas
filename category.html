<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>Categoría | Finanzas</title>
  <link rel="icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=23">
</head>
<body data-page="category">
  <main class="app-shell inner-page">
    <header class="inner-header category-header">
      <a class="back-link" href="./history.html" aria-label="Volver">←</a>
      <div>
        <p id="categoryMonth" class="eyebrow">DETALLE DE CATEGORÍA</p>
        <h1 id="categoryTitle">Categoría</h1>
        <p id="categoryTotal" class="page-subtitle"></p>
      </div>
      <div id="connectionStatus" class="status-pill compact" aria-live="polite">Conectando…</div>
    </header>

    <section class="panel list-panel">
      <div id="categoryList" class="history-list">
        <p class="empty-state">Cargando movimientos…</p>
      </div>
    </section>
  </main>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialog-card">
      <h2>Eliminar movimiento</h2>
      <p>Esta acción no se puede deshacer.</p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-button">Cancelar</button>
        <button id="confirmDeleteButton" value="confirm" class="danger-button">Eliminar</button>
      </div>
    </form>
  </dialog>

  <nav class="bottom-dock" aria-label="Menú principal">
    <a class="dock-item" href="./index.html"><span class="dock-icon">⌂</span><small>Inicio</small></a>
    <a class="dock-item" href="./register.html"><span class="dock-icon">＋</span><small>Registrar</small></a>
    <a class="dock-item" href="./payments.html"><span class="dock-icon">✓</span><small>Próximos pagos</small></a>
  </nav>

  <script type="module" src="./app-v23.js"></script>
</body>
</html>
