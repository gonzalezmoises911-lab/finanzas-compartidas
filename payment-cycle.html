<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>Pagos del mes | Finanzas</title>
  <link rel="icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=21">
</head>
<body data-page="payment-cycle">
  <main class="app-shell inner-page">
    <header class="inner-header">
      <a class="back-link" href="./payments.html" aria-label="Volver">←</a>
      <div>
        <p id="paymentMonth" class="eyebrow">PAGOS DEL MES</p>
        <h1 id="paymentCycleTitle">Pagos</h1>
        <p class="page-subtitle">Cada mes vuelven automáticamente a Pendiente.</p>
      </div>
      <div id="connectionStatus" class="status-pill compact" aria-live="polite">Conectando…</div>

    <section class="panel payment-list-panel">
      <div id="scheduledPayments" class="scheduled-payments">
        <p class="empty-state">Cargando pagos…</p>
      </div>
      <p id="paymentStatusMessage" class="sync-note" aria-live="polite"></p>
    </section>
  </main>

  <nav class="bottom-dock" aria-label="Menú principal">
    <a class="dock-item" href="./index.html"><span class="dock-icon">⌂</span><small>Inicio</small></a>
