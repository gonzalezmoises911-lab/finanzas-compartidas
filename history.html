<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c31">
  <title>Histórico | Finanzas</title>
  <link rel="icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20">
</head>
<body data-page="history">
  <main class="app-shell inner-page">
    <header class="inner-header">
      <a class="back-link" href="./index.html" aria-label="Volver">←</a>
      <div>
        <p class="eyebrow">TODOS LOS MOVIMIENTOS</p>
        <h1>Histórico general</h1>
      </div>
      <div id="connectionStatus" class="status-pill compact" aria-live="polite">Conectando…</div>
    </header>

    <section class="panel list-panel">
      <div id="historyList" class="history-list">
        <p class="empty-state">Cargando movimientos…</p>
      </div>
    </section>
  </main>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialog-card">
      <h2>Eliminar movimiento</h2>
      <p>Esta acción no se puede deshacer.</p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-button">Cancelar</button>
        <button id="confirmDeleteButton" value="confirm" class="danger-button">Eliminar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app-v20.js"></script>
</body>
</html>
