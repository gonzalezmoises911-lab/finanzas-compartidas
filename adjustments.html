<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <meta name="description" content="Ajuste manual de saldos de Finanzas Compartidas.">
  <title>Ajustes · Finanzas</title>
  <link rel="manifest" href="./manifest.webmanifest?v=25">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=25">
</head>
<body data-page="adjustments">
  <main class="app-shell">
    <header class="inner-header">
      <a class="back-link" href="./index.html" aria-label="Volver">←</a>
      <div>
        <p class="eyebrow">ACCESO PROTEGIDO</p>
        <h1>Ajuste</h1>
        <p class="page-subtitle">Modifica manualmente los saldos cuando necesites corregir diferencias.</p>
      </div>
      <div id="connectionStatus" class="status-pill compact" aria-live="polite">Conectando…</div>
    </header>

    <section id="adjustmentContent" class="adjustment-stack" hidden>
      <article class="panel adjustment-card">
        <div class="adjustment-card-head">
          <div>
            <span class="adjustment-label">Saldo real</span>
            <strong id="adjustmentCurrentDisplay">₡0</strong>
          </div>
          <button id="editCurrentButton" class="adjust-edit-button" type="button">Editar</button>
        </div>
        <div id="currentEditArea" class="adjustment-edit-area" hidden>
          <label for="adjustmentCurrentInput">Nuevo saldo real</label>
          <div class="input-with-prefix">
            <span>₡</span>
            <input id="adjustmentCurrentInput" type="text" inputmode="numeric" autocomplete="off">
          </div>
        </div>
      </article>

      <article class="panel adjustment-card adjustment-card-credit">
        <div class="adjustment-card-head">
          <div>
            <span class="adjustment-label">Total crédito</span>
            <strong id="adjustmentCreditDisplay">₡0</strong>
          </div>
          <button id="editCreditButton" class="adjust-edit-button credit" type="button">Editar</button>
        </div>
        <div id="creditEditArea" class="adjustment-edit-area" hidden>
          <label for="adjustmentCreditInput">Nuevo total crédito</label>
          <div class="input-with-prefix credit-prefix">
            <span>₡</span>
            <input id="adjustmentCreditInput" type="text" inputmode="numeric" autocomplete="off">
          </div>
        </div>
      </article>

      <button id="saveAdjustmentsButton" class="primary-button adjustment-save" type="button" hidden>Guardar cambios</button>
      <p id="adjustmentMessage" class="form-message" aria-live="polite"></p>
    </section>
  </main>

  <nav class="bottom-dock" aria-label="Menú principal">
    <a class="dock-item" href="./index.html"><span class="dock-icon">⌂</span><small>Inicio</small></a>
    <a class="dock-item" href="./register.html"><span class="dock-icon">＋</span><small>Registrar</small></a>
    <a class="dock-item active" href="./adjustments.html" aria-current="page"><span class="dock-icon">⚙</span><small>Ajuste</small></a>
  </nav>

  <dialog id="pinDialog" class="pin-dialog">
    <form id="pinForm" class="dialog-card pin-card">
      <div class="pin-icon" aria-hidden="true">🔒</div>
      <h2>Ingresar PIN</h2>
      <p>Este apartado está protegido.</p>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••" aria-label="PIN de acceso" required>
      <button class="primary-button pin-submit" type="submit">Continuar</button>
      <p id="pinMessage" class="form-message" aria-live="polite"></p>
    </form>
  </dialog>

  <script type="module" src="./app-v25.js"></script>
</body>
</html>
