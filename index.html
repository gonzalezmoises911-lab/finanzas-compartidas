<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <meta name="description" content="Finanzas compartidas: saldos, histórico y próximos pagos.">
  <title>Finanzas Compartidas</title>
  <link rel="manifest" href="./manifest.webmanifest?v=23">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=23">
</head>
<body data-page="home">
  <main class="app-shell home-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CONTROL COMPARTIDO</p>
        <h1>Finanzas</h1>
      </div>
      <div id="connectionStatus" class="status-pill" aria-live="polite">Conectando…</div>
    </header>

    <section class="balance-grid" aria-label="Resumen financiero">
      <a class="balance-card cash-card clickable-balance" href="./income-history.html" aria-label="Ver depósitos del saldo real">
        <div class="balance-copy">
          <span>Saldo real</span>
          <strong id="currentBalance">₡0</strong>
        </div>
        <div class="cash-photo" aria-label="Billetes de colones">
          <img src="./colones-cr.png" alt="Billetes de colones costarricenses">
        </div>
      </a>

      <a class="balance-card credit-card clickable-balance" href="./credit-history.html" aria-label="Ver gastos de crédito">
        <div class="balance-copy">
          <span>Total crédito</span>
          <strong id="cardBalance">₡0</strong>
        </div>
        <div class="bac-logo-card" aria-label="BAC Credomatic">
          <img src="./bac-credomatic.png" alt="BAC Credomatic">
        </div>
      </a>
    </section>

    <a class="history-entry" href="./history.html" aria-label="Abrir histórico general">
      <span class="history-entry-icon">↗</span>
      <span class="history-entry-copy">
        <small>VER TODO</small>
        <strong>Histórico general</strong>
      </span>
      <span class="history-entry-arrow">›</span>
    </a>

    <a class="history-entry payments-entry" href="./payments.html" aria-label="Abrir próximos pagos">
      <span class="history-entry-icon">✓</span>
      <span class="history-entry-copy">
        <small>15 Y 30 DE CADA MES</small>
        <strong>Próximos pagos</strong>
      </span>
      <span class="history-entry-arrow">›</span>
    </a>
  </main>

  <nav class="bottom-dock" aria-label="Menú principal">
    <a class="dock-item active" href="./index.html" aria-current="page">
      <span class="dock-icon">⌂</span><small>Inicio</small>
    </a>
    <a class="dock-item" href="./register.html">
      <span class="dock-icon">＋</span><small>Registrar</small>
    </a>
    <a class="dock-item" href="./payments.html">
      <span class="dock-icon">✓</span><small>Próximos pagos</small>
    </a>
  </nav>

  <script type="module" src="./app-v23.js"></script>
</body>
</html>
